events {}

http {

    log_format analyzer
    '$remote_addr '
    '[$time_local] '
    '"$request" '
    '$status '
    '$body_bytes_sent '
    '"$http_referer" '
    '"$http_user_agent" '
    '"$host" '
    '"$request_uri" '
    '"$query_string" '
    '"$request_time" '
    '"$remote_user"';


    access_log /var/log/nginx/access.log analyzer;


    server {

        listen 80;


        location / {

            proxy_pass http://flask-lab:5000;


            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        }
    }
}