services:

  flask-app:

    image: flask-webserver

    container_name: flask-lab

    expose:
      - "5000"


  nginx:

    image: nginx:latest

    container_name: nginx-proxy


    ports:

      - "8080:80"


    volumes:

      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

      - ./logs:/var/log/nginx


    depends_on:

      - flask-app